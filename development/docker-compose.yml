networks:
  t2c-backend:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.16.112.0/24
          gateway: 172.16.112.1

services:

  t2c-backend-postgresql:
    image: postgres:17.5-alpine
    container_name: t2c-backend-postgresql
    hostname: t2c-backend-postgresql
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DATABASE_USER:-temp_user}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-t2cTemp}
      - POSTGRES_DB=${DATABASE_NAME:-temp_master}
    volumes:
      - t2c_backend_postgresql_data:/var/lib/postgresql/data
    networks:
      - t2c-backend

volumes:
  t2c_backend_postgresql_data:

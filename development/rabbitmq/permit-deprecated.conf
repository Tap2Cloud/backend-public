# Permit the `transient_nonexcl_queues` feature that RabbitMQ 4.x deprecates
# and denies by default. Celery's worker remote-control (pidbox) queue is
# declared as transient + non-exclusive, which is exactly this combination.
# Re-enabling it lets `celery ... inspect/control` keep working on RabbitMQ 4.3.
#
# NOTE: this is a deprecated feature and may be removed in a future RabbitMQ
# major version. Treat it as a bridge, not a permanent solution.
deprecated_features.permit.transient_nonexcl_queues = true

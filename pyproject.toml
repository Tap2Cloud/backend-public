[project]
name = "tap2cloud-backend-opensource"
version = "0.1.5"
description = "Open source t2c backend base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.32.0",
    "babel>=2.18.0",
    "cryptography>=50.0.2",
    "fastapi-pagination>=0.16.1",
    "fastapi[all]>=0.162.0",
    "gunicorn>=26.2.0",
    "jsonschema>=4.26.0",
    "lettr>=1.7.0",
    "loguru>=0.7.3",
    "pyjwt>=2.15.1",
    "python-gettext>=5.0",
    "reportlab>=5.1.0",
    "sib-api-v3-sdk>=7.6.0",
    "sqlalchemy-utils>=0.43.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "tomlkit>=0.15.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]
test = [
    "faker>=40.43.0",
    "pillow>=13.0.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
    "pytest-order>=1.5.0",
]


[tool.pytest.ini_options]
pythonpath = [".", "t2c_backend"]
testpaths = ["t2c_backend/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "N", "A", "UP", "F", "E", "T20"]


[tool.setuptools.packages.find]
include = ["t2c_backend*"]
exclude = ["data*", "images*", "alembic*", "development*", "tests*"]

# Ship the source catalogs so downstream projects can merge them into their own
# (see t2c_backend/core/i18n/sync.py); compiled .mo files are never committed.
[tool.setuptools.package-data]
t2c_backend = ["locales/*/LC_MESSAGES/*.po"]


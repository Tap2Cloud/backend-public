[project]
name = "tap2cloud-backend-opensource"
version = "0.1.0"
description = "Open source t2c backend base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.0",
    "alembic>=1.18.4",
    "asgi-correlation-id>=5.0.0",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "celery>=5.6.3",
    "cryptography>=48.0.0",
    "confluent-kafka>=2.14.2",
    "email-validator>=2.3.0",
    "fastapi-pagination>=0.15.14",
    "fastapi[all]>=0.136.3",
    "gunicorn>=26.0.0",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "mollie-api-python>=4.0.0",
    "pycountry>=26.2.16",
    "pyjwt>=2.13.0",
    "python-gettext>=5.0",
    "redis>=8.0.0",
    "reportlab>=4.5.1",
    "sentry-sdk[fastapi]>=2.61.1",
    "sib-api-v3-sdk>=7.6.0",
    "sqlalchemy-utils>=0.42.1",
    "sqlalchemy[asyncio]>=2.0.50",
    "tomlkit>=0.15.0",
    "uvicorn>=0.49.0",
    "websockets>=16.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = [
    "tests",
]

[dependency-groups]
dev = [
    "ruff>=0.15.16",
]
test = [
    "faker>=40.21.0",
    "pillow>=12.2.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-order>=1.4.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "N", "A", "UP", "F", "E", "T20"]


[tool.setuptools.packages.find]
include = ["t2c_backend*"]
exclude = ["data*", "images*", "alembic*", "development*", "tests*"]


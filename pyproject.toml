[project]
name = "tap2cloud-backend-opensource"
version = "0.1.0"
description = "Open source t2c backend base"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.14.1",
    "alembic>=1.18.5",
    "asgi-correlation-id>=5.0.1",
    "asyncpg>=0.31.0",
    "babel>=2.18.0",
    "cryptography>=49.0.0",
    "fastapi-pagination>=0.15.15",
    "fastapi[all]>=0.139.0",
    "gunicorn>=26.0.0",
    "jsonschema>=4.26.0",
    "loguru>=0.7.3",
    "pyjwt>=2.13.0",
    "python-gettext>=5.0",
    "reportlab>=5.0.0",
    "sib-api-v3-sdk>=7.6.0",
    "sqlalchemy-utils>=0.42.1",
    "sqlalchemy[asyncio]>=2.0.51",
    "tomlkit>=0.15.0",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
]
test = [
    "faker>=40.28.1",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-order>=1.5.0",
]


[tool.pytest.ini_options]
pythonpath = [".", "t2c_backend"]
testpaths = ["t2c_backend/tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["I", "N", "A", "UP", "F", "E", "T20"]


[tool.setuptools.packages.find]
include = ["t2c_backend*"]
exclude = ["data*", "images*", "alembic*", "development*", "tests*"]

